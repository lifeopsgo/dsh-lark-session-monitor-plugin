name: Feature request
description: Suggest a capability or an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This plugin reads Feishu conversations as the signed-in user. Please describe
        the outcome you want rather than a specific implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where the plugin falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including anything you do today instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this request.
          required: true
