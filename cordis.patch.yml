# dsh-lark-session-monitor-plugin bundle patch: inserts this plugin's Host half into a
# profile's layer stack. The client half is discovered through the package's
# `dsh.client` manifest and loaded into the Web GUI; only the Node half is a
# loader entry.
#
# `name` is the package name, resolved through the profile's node_modules.
# Overriding this row replaces its whole config (no deep merge) — restate every
# key you want to keep. See the README's "Settings reference" for the options.
- insert:
    - id: lark-session-monitor
      name: 'dsh-lark-session-monitor-plugin'
